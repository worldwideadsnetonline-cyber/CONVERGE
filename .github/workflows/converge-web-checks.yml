name: CONVERGE Web checks
on:
  push:
    branches: [web-platform]
    paths: ['web/**']
  pull_request:
    branches: [web-platform]
    paths: ['web/**']
jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: node --check public/app.js
