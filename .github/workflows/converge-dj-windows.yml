name: Build CONVERGE DJ Studio for Windows
on:
  workflow_dispatch:
  push:
    branches: ["converge-dj-studio"]
    paths:
      - "CONVERGE-DJ-Studio/**"
      - ".github/workflows/converge-dj-windows.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: CONVERGE-DJ-Studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: CONVERGE-DJ-Studio-Windows-Installer
          path: CONVERGE-DJ-Studio/dist/*.exe
          if-no-files-found: error
