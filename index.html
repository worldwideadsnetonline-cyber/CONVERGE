<!doctype html><html lang="pt"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src https://api.openai.com"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONVERGE</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="logo">C</div> CONVERGE</div><button id="newChat" class="new-chat">＋ Novo chat</button><div class="history-label">CONVERSAS</div><div id="history" class="history"></div><div class="sidebar-bottom"><button id="settingsBtn" class="settings">⚙ Definições</button></div></aside><main class="main"><header><div class="top-title">CONVERGE <span class="tag">AI</span></div><select id="model"><option value="gpt-4o-mini">GPT-4o mini</option><option value="gpt-4o">GPT-4o</option></select></header><section id="chat" class="chat"><div id="welcome" class="welcome"><div class="welcome-icon">✦</div><h1>Em que posso ajudar?</h1><p>Converse, explore ideias e crie algo novo.</p></div></section><form id="form" class="composer"><textarea id="prompt" rows="1" placeholder="Escreva uma mensagem..." autocomplete="off"></textarea><button id="send" aria-label="Enviar">↑</button><div class="composer-hint">A IA pode cometer erros. Verifique informações importantes.</div></form><div id="settings" class="settings-panel hidden"><div class="settings-card"><button id="closeSettings" class="close">×</button><h2>Definições</h2><label>Chave API OpenAI</label><input id="apiKey" type="password" placeholder="sk-..."><p class="muted">A chave é guardada cifrada localmente no Windows.</p><div class="settings-actions"><button id="clearKey" class="secondary">Remover chave</button><button id="saveKey" class="primary">Guardar chave</button></div><p id="settingsStatus" class="status"></p></div></div></main></div><script src="renderer.js"></script></body></html>
