name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: ["converge-dj-studio"]
    tags: ["dj-v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: CONVERGE-DJ-Studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: CONVERGE-DJ-Studio/package.json
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: CONVERGE-DJ-Studio-Windows-Installer
          path: CONVERGE-DJ-Studio/dist/*.exe
          if-no-files-found: error